<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>yngel's love corner 💌</title>
  <meta name="description" content="A cute personalized letter (burgundy motif)." />
  <style>
    :root{
      --bg1:#f8e9ee;
      --bg2:#efe4e8;
      --card:#ffffffde;
      --text:#2b0f17;
      --muted:#7a4a57;
      --accent:#7a1f3d;
      --accent2:#a8324f;
      --shadow: 0 20px 45px rgba(122,31,61,.22);
      --radius: 22px;

      --paper:#fffafc;
      --paperEdge:#f1d6df;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 700px at 15% 15%, var(--bg1), transparent 60%),
        radial-gradient(1200px 700px at 85% 25%, var(--bg2), transparent 60%),
        linear-gradient(135deg, #fff5f7, #f3e6ea);
      overflow-x:hidden;
      padding: 22px 0;
    }

    .wrap{ width:min(980px, 92vw); }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:14px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      box-shadow:0 6px 18px rgba(122,31,61,.18);
      border:1px solid rgba(255,255,255,.95);
      font-weight:800;
      letter-spacing:.3px;
    }

    .spark{
      width:12px;height:12px;border-radius:999px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 0 0 6px rgba(122,31,61,.22);
    }

    .tiny{ font-size:12px; color:var(--muted); }

    .card{
      position:relative;
      border-radius:var(--radius);
      background:var(--card);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.95);
      box-shadow:var(--shadow);
      padding:22px;
      overflow:hidden;
    }

    .floaties{
      position:absolute;
      inset:-120px -120px auto auto;
      width:380px;
      height:380px;
      background:
        radial-gradient(circle at 35% 30%, rgba(122,31,61,.45), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(168,50,79,.35), transparent 52%);
      transform: rotate(15deg);
      pointer-events:none;
      opacity:.95;
    }

    .rowTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
      position:relative;
      z-index:1;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(122,31,61,.12);
      color:#7a1f3d;
      font-weight:900;
      font-size:13px;
      border:1px solid rgba(122,31,61,.25);
    }

    button{
      border:0;
      border-radius:14px;
      padding:10px 14px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      color:white;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 12px 28px rgba(122,31,61,.30);
      transition: transform .08s ease, filter .2s ease;
    }
    button:hover{ filter: brightness(1.02); }
    button:active{ transform: scale(.99); }

    .ghost{
      background:rgba(122,31,61,.08);
      color:#2b0f17;
      border:1px solid rgba(122,31,61,.25);
      box-shadow:none;
    }

    .letter{
      position:relative;
      z-index:1;
      margin-top:8px;
      border-radius:18px;
      background:linear-gradient(180deg, var(--paper), #fff);
      border:1px solid var(--paperEdge);
      box-shadow: 0 18px 34px rgba(17,24,39,.10);
      padding:18px 18px 16px;
    }

    .letterTitle{
      font-weight:1000;
      letter-spacing:.2px;
      color:#5a1830;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .letterText{
      font-size:16px;
      line-height:1.7;
      white-space:pre-wrap;
      color:var(--text);
    }

    .hint{
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
      position:relative;
      z-index:1;
    }

    .footer{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    /* petals/hearts */
    #petals{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:10;
    }
    .petal{
      position:absolute;
      top:-12vh;
      left:0;
      width:14px;
      height:14px;
      border-radius: 14px 0 14px 0;
      background: rgba(122,31,61,.18);
      border: 1px solid rgba(122,31,61,.20);
      transform: rotate(25deg);
      filter: blur(.1px);
      animation: fall linear forwards;
    }
    .petal.heart{
      width:14px; height:14px;
      border-radius:0;
      background: rgba(168,50,79,.18);
      border: none;
      clip-path: path("M7 12 C-2 6 2 0 7 4 C12 0 16 6 7 12 Z");
      transform: rotate(0deg);
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{
        transform: translate3d(var(--dx), 115vh, 0) rotate(var(--rot));
        opacity:0;
      }
    }

    /* toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.92);
      border:1px solid rgba(122,31,61,.25);
      box-shadow:0 14px 36px rgba(122,31,61,.18);
      padding:10px 14px;
      border-radius:999px;
      font-weight:900;
      color:#5d1a30;
      z-index:20;
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>
<body>
  <div id="petals" aria-hidden="true"></div>
  <div class="toast" id="toast">Copied! 📋</div>

  <div class="wrap">
    <div class="top">
      <div class="badge"><span class="spark"></span> yngel's love corner</div>
      <div class="tiny" id="dateLine"></div>
    </div>

    <div class="card">
      <div class="floaties"></div>

      <div class="rowTop">
        <div class="pill" id="toPill">🌹 To: </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="ghost" id="copyBtn">Copy letter</button>
        </div>
      </div>

      <div class="letter">
        <div class="letterTitle" id="letterTitle">Your letter ✨</div>
        <div class="letterText" id="letterText"></div>
      </div>

      <div class="hint" id="hint"></div>
    </div>

    <div class="footer">Made with 💖</div>
  </div>

  <script>
    const signature = `\n\nLove, Sab 🤍`;

    const messages = {
      imma:
`Hi Imma 🌷

As the new year begins, I want to express my sincere gratitude for our friendship. Despite the distance, your presence has remained constant. Please know that I am always one call away ☎️

Wishing you a year filled with success, peace, and contentment ✨${signature}`,

      printot:
`Hi Printot 🌸

Happy New Year. I am truly grateful for our friendship and for the connection we continue to share, regardless of distance.

I wish you a year marked by growth, fulfillment, and continued success 🌱 You are always in my thoughts and prayers 🤍${signature}`,

      marmela:
`Hi Marmela 🌼

Entering the new year, I want to thank you for being a constant source of support and understanding. Distance has never diminished our friendship.

I am always here for you and wish you a year filled with meaningful achievements and quiet happiness 🌿${signature}`,

      alex:
`Hi Alex 🌹

As we welcome another year, I want you to know how much I value our friendship. Even from afar, it has remained strong.

May this year bring you clarity, success, and a sense of contentment in all that you do ✨${signature}`,

      angel:
`Hi Angel 🤍

Happy New Year. I am grateful for the trust and relationship we have built over time. No matter the distance, please know that I am always available should you need me.

Wishing you a year of steady progress and well-deserved success 🌟${signature}`,

      feb:
`Hi Feb 🌸

With the start of a new year, I want to extend my appreciation for your friendship. Distance has never been a barrier, and I remain only a call away ☎️

May the coming year bring you peace, fulfillment, and continued growth 🌱${signature}`,

      reg:
`Hi Reg 🌿

As the year turns, I reflect with gratitude on the friendships that have endured, including ours. Thank you for being a constant, regardless of distance.

I wish you a year filled with purpose, stability, and success ✨${signature}`,

      sandara:
`Hi Sandara 🌷

Happy New Year. I am thankful for our friendship and the consistency it has shown through time.

I wish you a year ahead filled with opportunity, balance, and contentment 🤍${signature}`,

      genelle:
`Hi Genelle 🌼

Entering this new year, I want to acknowledge how much I value our friendship. Even with distance, it remains strong.

Please know that I am always here for you and wish you a year marked by growth and fulfillment 🌱${signature}`,

      anestiene:
`Hi Anestiene 🌹

As we begin another year, I want to express my appreciation for our lasting friendship. Distance has never lessened its value.

Wishing you a year filled with success, peace of mind, and meaningful moments ✨${signature}`
    };

    const $ = (id) => document.getElementById(id);
    const toPill = $("toPill");
    const letterText = $("letterText");
    const hint = $("hint");
    const copyBtn = $("copyBtn");
    const toast = $("toast");

    function norm(s){ return (s || "").trim().toLowerCase(); }

    function setToast(text){
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(setToast._t);
      setToast._t = setTimeout(()=>toast.classList.remove("show"), 1200);
    }

    async function copyLetter(){
      try{
        await navigator.clipboard.writeText(letterText.textContent);
        setToast("Copied! 📋");
      } catch {
        setToast("Copy failed 😅");
      }
    }

    // Petals/hearts
    const petals = $("petals");
    function spawnPetal(){
      const el = document.createElement("div");
      const isHeart = Math.random() < 0.45;
      el.className = "petal" + (isHeart ? " heart" : "");

      const x = Math.random() * 100;
      const dx = (Math.random() * 120 - 60).toFixed(1) + "px";
      const rot = (Math.random() * 360 - 180).toFixed(1) + "deg";
      const dur = (Math.random() * 2.7 + 5.2).toFixed(2) + "s";
      const size = (Math.random() * 8 + 10).toFixed(0) + "px";

      el.style.left = x + "vw";
      el.style.setProperty("--dx", dx);
      el.style.setProperty("--rot", rot);
      el.style.animationDuration = dur;
      el.style.width = size;
      el.style.height = size;
      el.style.opacity = (Math.random() * 0.35 + 0.25).toFixed(2);

      petals.appendChild(el);
      setTimeout(()=> el.remove(), (parseFloat(dur) * 1000) + 500);
    }
    let petalInterval = setInterval(spawnPetal, 420);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { clearInterval(petalInterval); petalInterval = null; }
      else if (!petalInterval) petalInterval = setInterval(spawnPetal, 420);
    });

    // Init from link param: ?to=imma
    (function init(){
      const url = new URL(window.location.href);
      const to = norm(url.searchParams.get("to"));

      if(to && messages[to]){
        const displayName = to.charAt(0).toUpperCase() + to.slice(1);
        toPill.textContent = `🌹 To: ${displayName}`;
        letterText.textContent = messages[to];
        hint.textContent = "";
      } else {
        toPill.textContent = "🌹 To: (someone special)";
        letterText.textContent =
`Hi 💌

This link is missing a recipient key.
Ask the sender to resend the correct link. ${signature}`;
        hint.textContent = "Tip: links look like ?to=imma or ?to=alex";
      }
    })();

    copyBtn.addEventListener("click", copyLetter);

    // Date
    (function setDateLine(){
      const d = new Date();
      const opts = { year:"numeric", month:"short", day:"2-digit" };
      $("dateLine").textContent = d.toLocaleDateString(undefined, opts);
    })();
  </script>
</body>
</html>
